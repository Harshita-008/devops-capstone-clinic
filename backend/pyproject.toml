[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear and modern-syntax checks
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Stops ruff treating the local alembic/ folder as project code.
known-third-party = ["alembic"]
