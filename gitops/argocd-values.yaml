# Argo CD for the local kind cluster.
# helm install argocd argo/argo-cd --version 10.10.2 -n argocd --create-namespace -f gitops/argocd-values.yaml
global:
  domain: argocd.localhost

configs:
  params:
    # Plain HTTP is fine for the local cluster.
    server.insecure: true
  cm:
    # Check Git every minute (default is 3) so new commits roll out faster.
    timeout.reconciliation: 60s

server:
  ingress:
    enabled: true
    ingressClassName: traefik

# Single sign-on and notifications are not used in this project.
dex:
  enabled: false
notifications:
  enabled: false
