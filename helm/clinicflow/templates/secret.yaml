{{- $fullname := include "clinicflow.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username .Values.postgres.password $fullname .Values.postgres.database | quote }}
