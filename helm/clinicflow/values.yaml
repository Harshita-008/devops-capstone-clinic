# Images are built and pushed by the CI pipeline. Both share one tag: the Git commit SHA.
image:
  registry: ghcr.io/harshita-008
  tag: "f99cf32c222a70ebbbebfdf503bd05fc8e691dea"
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # With autoscaling on, the HPA sets the replica count instead of `replicas`.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  replicas: 2
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image: postgres:17-alpine
  database: clinic
  username: clinic
  # Local demo password only; a real deployment would use a secret manager.
  password: clinic-local-password
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

monitoring:
  # ServiceMonitor and Grafana dashboard, added only if Prometheus Operator is installed.
  enabled: true
  scrapeInterval: 15s

ingress:
  enabled: true
  className: traefik
  # *.localhost always points to this machine, so no hosts file change is needed.
  host: clinicflow.localhost
