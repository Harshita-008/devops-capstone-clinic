# Ingress controller. ingress-nginx was archived in March 2026, so Traefik implements the
# standard Kubernetes Ingress resources instead.
# helm install traefik traefik/traefik --version 41.7.1 -n traefik --create-namespace -f k8s/addons/traefik-values.yaml
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
