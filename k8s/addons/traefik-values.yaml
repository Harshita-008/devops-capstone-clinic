# Ingress controller. ingress-nginx was archived in March 2026, so Traefik implements the
# standard Kubernetes Ingress resources instead.
# helm install traefik traefik/traefik --version 41.7.1 -n traefik --create-namespace -f k8s/addons/traefik-values.yaml
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# A NodePort Service has no load balancer IP to publish, which would leave every Ingress without an
# address (and Argo CD reporting it as Progressing). On kind the entry point is the laptop itself.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
