# Ingress controller (ingress-nginx was archived in March 2026).
# helm install traefik traefik/traefik --version 41.7.1 -n traefik --create-namespace -f k8s/addons/traefik-values.yaml
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# NodePort has no load balancer IP, so publish 127.0.0.1 as the Ingress address.
# Without it Argo CD keeps the Ingress at Progressing.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
