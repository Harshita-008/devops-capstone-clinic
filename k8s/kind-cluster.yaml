# Local Kubernetes cluster in Docker: kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clinicflow
nodes:
  - role: control-plane
    # Traefik's web entrypoint is exposed as NodePort 30080; this maps it to port 80 on the laptop,
    # so http://clinicflow.localhost reaches the Ingress controller.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
