# Local Kubernetes cluster in Docker: kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clinicflow
nodes:
  - role: control-plane
    # Port 80 on the laptop goes to Traefik's NodePort 30080.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
